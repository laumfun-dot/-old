<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>敬師日快樂！</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1>🌸 敬師日快樂 🌸</h1>
        <p class="to">親愛的 <span id="teacher-name">老師</span>：</p>
        <p class="message">感謝您一直以來的辛勤栽培與耐心指導，祝您敬師日快樂，身體健康，工作順利！</p>
        
        <div class="interactive-zone">
            <button onclick="showBlessing()">點擊收取學生祝福 🎁</button>
            <p id="hidden-blessing" class="hidden">✨ 桃李滿天下，教澤永綿長！謝謝您！ ✨</p>
        </div>

        <p class="from">學生 敬上</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
